<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TimeStamp 2.0</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e1e2f">
  <style>
    :root {
      --bg-color: #12121c;
      --card-bg: #1e1e2f;
      --accent-color: #6c5ce7;
      --text-color: #ffffff;
      --text-dim: #a0a0b0;
      --danger-color: #e74c3c;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1, h2, h3 { margin: 10px 0; text-align: center; }

    .container { width: 100%; max-width: 500px; }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    select, button, input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 10px;
      border: none;
      font-size: 16px;
      background: #2a2a40;
      color: var(--text-color);
      box-sizing: border-box;
    }

    button {
      background: var(--accent-color);
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:active { filter: brightness(0.8); }

    .timer-display {
      font-size: 48px;
      font-weight: bold;
      text-align: center;
      margin: 20px 0;
      font-family: monospace;
    }

    /* Stempel-Grid */
    .stempel-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 15px;
    }

    .stempel-card {
      background: #252538;
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 2px solid transparent;
    }

    .stempel-icon {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin-bottom: 10px;
      background: #33334d;
      transition: all 0.3s;
    }

    /* Skins */
    .skin-default { background: #3a3a5e; }
    .skin-kosmos { background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); }
    .skin-neon { background: #000; border: 2px solid #00ffcc; box-shadow: 0 0 10px #00ffcc; }
    .skin-antik { background: #d4a373; color: #332211; }

    /* Prestige Effekte */
    .prestige-1 { border-color: #ffd700; }
    .prestige-2 { border-color: #ffd700; box-shadow: 0 0 10px #ffd700; }
    .prestige-3 { border-color: #00ffff; box-shadow: 0 0 15px #00ffff; }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: #3a3a5e;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 8px;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent-color);
      width: 0%;
      transition: width 0.3s;
    }

    /* Logbuch Styles */
    .log-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #252538;
      padding: 10px 14px;
      border-radius: 10px;
      margin-bottom: 8px;
    }

    .log-info { display: flex; flex-direction: column; }
    .log-title { font-weight: bold; font-size: 15px; }
    .log-date { font-size: 12px; color: var(--text-dim); }

    .delete-btn {
      width: auto;
      padding: 6px 12px;
      margin: 0;
      background: var(--danger-color);
      font-size: 14px;
    }

    .hidden { display: none; }
  </style>
</head>
<body>

<div class="container">
  <h1>🏷️ TimeStamp 2.0</h1>

  <!-- START BEREICH -->
  <div id="setup-bereich" class="card">
    <h2>Session Starten</h2>
    <label>Fach:</label>
    <select id="fach-select"></select>

    <label>Modus:</label>
    <select id="modus-select" onchange="toggleModusInput()">
      <option value="timer">Timer (feste Zeit)</option>
      <option value="stoppuhr">Stoppuhr (offen)</option>
    </select>

    <div id="timer-input-box">
      <label>Dauer (Minuten):</label>
      <input type="number" id="dauer-input" value="25" min="1">
    </div>

    <button onclick="starteSession()">🚀 Lernen Starten</button>
  </div>

  <!-- FOKUS BEREICH -->
  <div id="fokus-bereich" class="card hidden">
    <h2 id="fokus-fach-titel">Lernen...</h2>
    <div class="timer-display" id="zeit-anzeige">00:00</div>
    <p style="text-align: center; color: var(--text-dim);">🔒 Fokus aktiv – Bleib dran!</p>
    <button onclick="beendeSession()" style="background: var(--danger-color);">Session Beenden</button>
  </div>

  <!-- STEMPEL BEREICH -->
  <div class="card">
    <h2>Deine Stempelsammlung</h2>
    <div class="stempel-grid" id="stempel-liste"></div>
  </div>

  <!-- LOGBUCH BEREICH -->
  <div class="card">
    <h2>📜 Logbuch &amp; Verlauf</h2>
    <div id="logbuch-liste"></div>
  </div>
</div>

<script>
// INITIALE FÄCHER DATEN
const faecherDef = [
  { id: 'mathe', name: 'Mathe', icon: '🧮' },
  { id: 'deutsch', name: 'Deutsch', icon: '📖' },
  { id: 'englisch', name: 'Englisch', icon: '🇬🇧' },
  { id: 'latein', name: 'Latein', icon: '🏛️' },
  { id: 'altgriechisch', name: 'Altgriechisch', icon: '🏺' },
  { id: 'physik', name: 'Physik', icon: '⚛️' },
  { id: 'biologie', name: 'Biologie', icon: '🧬' },
  { id: 'chemie', name: 'Chemie', icon: '⚗️' },
  { id: 'musik', name: 'Musik', icon: '🎵' },
  { id: 'religion', name: 'Religion', icon: '⛪' },
  { id: 'geschichte', name: 'Geschichte', icon: '🏰' },
  { id: 'powi', name: 'Politik & Wirtschaft', icon: '🗳️' }
];

// SPEICHER-DATEN LADEN ODER ERSTELLEN
let nutzerDaten = JSON.parse(localStorage.getItem('timestamp_2_daten')) || {};
let logbuch = JSON.parse(localStorage.getItem('timestamp_2_logbuch')) || [];

// Initialisiere fehlende Fächer im Speicher
faecherDef.forEach(f => {
  if (!nutzerDaten[f.id]) {
    nutzerDaten[f.id] = { minuten: 0, skin: 'default' };
  }
});

function speichereDaten() {
  localStorage.setItem('timestamp_2_daten', JSON.stringify(nutzerDaten));
  localStorage.setItem('timestamp_2_logbuch', JSON.stringify(logbuch));
}

// BERECHNUNG STEMPEL-LEVEL & PRESTIGE
function holeStempelStatus(minuten) {
  const stunden = minuten / 60;
  if (stunden < 1) return { stufe: 1, prestige: 0, maxMin: 60 };
  if (stunden < 3) return { stufe: 2, prestige: 0, maxMin: 180 };
  if (stunden < 5) return { stufe: 3, prestige: 0, maxMin: 300 };
  if (stunden < 10) return { stufe: 4, prestige: 0, maxMin: 600 };
  if (stunden < 20) return { stufe: 5, prestige: 0, maxMin: 1200 };
  if (stunden < 50) return { stufe: 6, prestige: 0, maxMin: 3000 };
  
  if (stunden < 100) return { stufe: 7, prestige: 1, maxMin: 6000 };
  if (stunden < 200) return { stufe: 7, prestige: 2, maxMin: 12000 };
  if (stunden < 350) return { stufe: 7, prestige: 3, maxMin: 21000 };
  return { stufe: 7, prestige: 4, maxMin: 30000 };
}

// OBERFLÄCHE AKTUALISIEREN
function rendereFaecher() {
  const select = document.getElementById('fach-select');
  const liste = document.getElementById('stempel-liste');
  
  select.innerHTML = '';
  liste.innerHTML = '';

  faecherDef.forEach(f => {
    const opt = document.createElement('option');
    opt.value = f.id;
    opt.textContent = `${f.icon} ${f.name}`;
    select.appendChild(opt);

    const daten = nutzerDaten[f.id];
    const status = holeStempelStatus(daten.minuten);
    
    const percent = Math.min(100, (daten.minuten / status.maxMin) * 100);

    const card = document.createElement('div');
    card.className = `stempel-card ${status.prestige > 0 ? 'prestige-' + status.prestige : ''}`;
    
    card.innerHTML = `
      <div class="stempel-icon skin-${daten.skin}">${f.icon}</div>
      <strong>${f.name}</strong>
      <small style="color:var(--text-dim)">
        ${status.prestige > 0 ? '⭐ Prestige ' + status.prestige : 'Stufe ' + status.stufe}
      </small>
      <small>${Math.floor(daten.minuten / 60)}h ${daten.minuten % 60}m</small>
      <div class="progress-bar">
        <div class="progress-fill" style="width: ${percent}%"></div>
      </div>
    `;
    liste.appendChild(card);
  });
}

function rendereLogbuch() {
  const logListe = document.getElementById('logbuch-liste');
  logListe.innerHTML = '';

  if (logbuch.length === 0) {
    logListe.innerHTML = '<p style="text-align:center; color:var(--text-dim); font-size:14px;">Noch keine Lerneinheiten aufgezeichnet.</p>';
    return;
  }

  // Neueste Sessions oben anzeigen
  logbuch.slice().reverse().forEach((eintrag) => {
    const fachObj = faecherDef.find(f => f.id === eintrag.fachId) || { name: eintrag.fachId, icon: '📚' };
    
    const item = document.createElement('div');
    item.className = 'log-item';
    item.innerHTML = `
      <div class="log-info">
        <span class="log-title">${fachObj.icon} ${fachObj.name} – ${eintrag.minuten} Min.</span>
        <span class="log-date">${eintrag.datum}</span>
      </div>
      <button class="delete-btn" onclick="loescheSession(${eintrag.id})">🗑️ Löschen</button>
    `;
    logListe.appendChild(item);
  });
}

function loescheSession(id) {
  const index = logbuch.findIndex(e => e.id === id);
  if (index !== -1) {
    const eintrag = logbuch[index];
    
    // Minuten vom Fach abziehen
    if (nutzerDaten[eintrag.fachId]) {
      nutzerDaten[eintrag.fachId].minuten = Math.max(0, nutzerDaten[eintrag.fachId].minuten - eintrag.minuten);
    }

    // Aus Logbuch entfernen
    logbuch.splice(index, 1);
    
    speichereDaten();
    rendereFaecher();
    rendereLogbuch();
  }
}

// TIMER LOGIK
let timerInterval = null;
let verbleibendeSekunden = 0;
let zielMinuten = 0;
let aktuellesFach = '';
let istStoppuhr = false;

function toggleModusInput() {
  const modus = document.getElementById('modus-select').value;
  document.getElementById('timer-input-box').classList.toggle('hidden', modus === 'stoppuhr');
}

function starteSession() {
  aktuellesFach = document.getElementById('fach-select').value;
  const modus = document.getElementById('modus-select').value;
  istStoppuhr = modus === 'stoppuhr';

  if (!istStoppuhr) {
    zielMinuten = parseInt(document.getElementById('dauer-input').value) || 25;
    verbleibendeSekunden = zielMinuten * 60;
  } else {
    verbleibendeSekunden = 0;
  }

  document.getElementById('setup-bereich').classList.add('hidden');
  document.getElementById('fokus-bereich').classList.remove('hidden');
  
  const fachObj = faecherDef.find(f => f.id === aktuellesFach);
  document.getElementById('fokus-fach-titel').textContent = `${fachObj.icon} ${fachObj.name}`;

  updateTimerAnzeige();

  timerInterval = setInterval(() => {
    if (istStoppuhr) {
      verbleibendeSekunden++;
    } else {
      verbleibendeSekunden--;
      if (verbleibendeSekunden <= 0) {
        beendeSession();
        return;
      }
    }
    updateTimerAnzeige();
  }, 1000);
}

function updateTimerAnzeige() {
  const m = Math.floor(verbleibendeSekunden / 60).toString().padStart(2, '0');
  const s = (verbleibendeSekunden % 60).toString().padStart(2, '0');
  document.getElementById('zeit-anzeige').textContent = `${m}:${s}`;
}

function beendeSession() {
  clearInterval(timerInterval);
  
  let gelernteMinuten = 0;
  if (istStoppuhr) {
    gelernteMinuten = Math.floor(verbleibendeSekunden / 60);
  } else {
    gelernteMinuten = zielMinuten - Math.ceil(verbleibendeSekunden / 60);
  }

  if (gelernteMinuten > 0) {
    nutzerDaten[aktuellesFach].minuten += gelernteMinuten;

    // Eintrag für Logbuch erstellen
    const jetzt = new Date();
    const datumString = jetzt.toLocaleDateString('de-DE') + ' um ' + jetzt.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
    
    logbuch.push({
      id: Date.now(),
      fachId: aktuellesFach,
      minuten: gelernteMinuten,
      datum: datumString
    });

    speichereDaten();
    alert(`🎉 Super! Du hast ${gelernteMinuten} Minuten gelernt!`);
  }

  document.getElementById('fokus-bereich').classList.add('hidden');
  document.getElementById('setup-bereich').classList.remove('hidden');
  rendereFaecher();
  rendereLogbuch();
}

// INITIALISIERUNG
rendereFaecher();
rendereLogbuch();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
